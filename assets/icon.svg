<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Panel Frame with Shadow -->
  <rect x="48" y="48" width="416" height="416" rx="44" fill="url(#panelGrad)" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>

  <!-- Screen Area -->
  <rect x="76" y="76" width="360" height="252" rx="20" fill="#031326" stroke="#1e293b" stroke-width="2"/>
  <rect x="80" y="80" width="352" height="244" rx="18" fill="url(#screenGrad)" opacity="0.95"/>

  <!-- Screen UI Elements: Weather & Temp Widget -->
  <circle cx="140" cy="148" r="28" fill="#fbbf24"/>
  <path d="M125 170 A 24 24 0 0 1 175 165 A 18 18 0 0 1 200 185 A 12 12 0 0 1 190 200 L 130 200 A 15 15 0 0 1 125 170 Z" fill="#e0f2fe" opacity="0.9"/>
  <text x="215" y="172" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="700">22.5°</text>
  <text x="218" y="202" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="500">LIVING ROOM</text>

  <!-- Screen Quick Action Buttons -->
  <rect x="100" y="232" width="68" height="68" rx="14" fill="#0c4a6e" stroke="url(#accentGrad)" stroke-width="2"/>
  <!-- Light bulb icon -->
  <path d="M134 246 C126 246 120 252 120 259 C120 264 123 268 126 271 L126 276 C126 277 127 278 128 278 L140 278 C141 278 142 277 142 276 L142 271 C145 268 148 264 148 259 C148 252 142 246 134 246 Z M129 281 L139 281 L139 282 C139 283.5 137.5 285 134 285 C130.5 285 129 283.5 129 282 Z" fill="#fef08a"/>

  <rect x="184" y="232" width="68" height="68" rx="14" fill="#075985" opacity="0.8"/>
  <!-- Thermostat flame icon -->
  <path d="M218 246 C218 246 226 256 226 264 C226 270 222 276 218 276 C214 276 210 270 210 264 C210 256 218 246 218 246 Z" fill="#f87171"/>

  <rect x="268" y="232" width="68" height="68" rx="14" fill="#075985" opacity="0.8"/>
  <!-- Blinds icon -->
  <rect x="282" y="249" width="40" height="4" rx="2" fill="#bae6fd"/>
  <rect x="282" y="257" width="40" height="4" rx="2" fill="#bae6fd"/>
  <rect x="282" y="265" width="40" height="4" rx="2" fill="#bae6fd"/>
  <rect x="282" y="273" width="40" height="4" rx="2" fill="#bae6fd"/>

  <rect x="352" y="232" width="60" height="68" rx="14" fill="#075985" opacity="0.8"/>
  <!-- Scene star icon -->
  <polygon points="382,246 386,258 398,258 388,266 392,278 382,270 372,278 376,266 366,258 378,258" fill="#fbbf24"/>

  <!-- Divider Line -->
  <line x1="60" y1="348" x2="452" y2="348" stroke="#334155" stroke-width="2"/>

  <!-- Physical Buttons Area -->
  <!-- Left Button -->
  <rect x="76" y="364" width="170" height="76" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="161" cy="382" r="4" fill="#38bdf8"/>
  <path d="M156 404 C156 401 166 401 166 404 L166 414 C166 417 156 417 156 414 Z" fill="#94a3b8"/>
  <circle cx="161" cy="409" r="6" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Right Button -->
  <rect x="266" y="364" width="170" height="76" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="351" cy="382" r="4" fill="#64748b"/>
  <!-- Power icon -->
  <path d="M351 398 L351 408" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M343 403 A 11 11 0 1 0 359 403" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
