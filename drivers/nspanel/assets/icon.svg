<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Wall Plate / Bezel -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="none" stroke="currentColor" stroke-width="5"/>
  
  <!-- Touchscreen Display Area -->
  <rect x="15" y="15" width="70" height="48" rx="6" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="3"/>
  
  <!-- Screen Content: Minimalist Thermostat Arc & Status -->
  <circle cx="50" cy="35" r="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="60 30" stroke-linecap="round"/>
  <circle cx="50" cy="35" r="4" fill="currentColor"/>
  <line x1="24" y1="52" x2="34" y2="52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="52" x2="58" y2="52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66" y1="52" x2="76" y2="52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Physical Buttons Area Separator -->
  <line x1="12" y1="69" x2="88" y2="69" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Left Button (Button 1) -->
  <rect x="15" y="73" width="32" height="15" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="31" cy="80.5" r="2" fill="currentColor"/>
  
  <!-- Right Button (Button 2) -->
  <rect x="53" y="73" width="32" height="15" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="69" cy="80.5" r="2" fill="currentColor"/>
</svg>
